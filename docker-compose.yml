services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?POSTGRES_DB must be set}
      POSTGRES_USER: ${POSTGRES_USER:?POSTGRES_USER must be set}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "PGPASSWORD=$$POSTGRES_PASSWORD psql -h 127.0.0.1 -U $$POSTGRES_USER -d $$POSTGRES_DB -c 'SELECT 1' >/dev/null"
        ]
      interval: 10s
      timeout: 5s
      retries: 10

  api:
    build:
      context: .
    image: ${DOCKER_IMAGE_NAME:?DOCKER_IMAGE_NAME must be set}:${DOCKER_IMAGE_TAG:?DOCKER_IMAGE_TAG must be set}
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "${APP_PORT:?APP_PORT must be set}:8000"
    environment:
      MODEL_PATH: /app/artifacts/model.joblib
      METADATA_PATH: /app/artifacts/model_metadata.json
      METRICS_PATH: /app/artifacts/metrics.json
      DATABASE_HOST: ${DATABASE_HOST:?DATABASE_HOST must be set}
      DATABASE_PORT: ${DATABASE_PORT:?DATABASE_PORT must be set}
      DATABASE_NAME: ${POSTGRES_DB:?POSTGRES_DB must be set}
      DATABASE_USER: ${POSTGRES_USER:?POSTGRES_USER must be set}
      DATABASE_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set}
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=5)"]
      interval: 15s
      timeout: 5s
      retries: 5

  db-seed:
    profiles: ["seed"]
    image: ${DOCKER_IMAGE_NAME:?DOCKER_IMAGE_NAME must be set}:${DOCKER_IMAGE_TAG:?DOCKER_IMAGE_TAG must be set}
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_HOST: ${DATABASE_HOST:?DATABASE_HOST must be set}
      DATABASE_PORT: ${DATABASE_PORT:?DATABASE_PORT must be set}
      DATABASE_NAME: ${POSTGRES_DB:?POSTGRES_DB must be set}
      DATABASE_USER: ${POSTGRES_USER:?POSTGRES_USER must be set}
      DATABASE_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set}
    command:
      [
        "python",
        "scripts/seed_database.py",
        "--train-path",
        "/app/data/processed/train.csv",
        "--test-path",
        "/app/data/processed/test.csv"
      ]
    restart: "no"

volumes:
  postgres_data:
