name: Lab1 CI

on:
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  build-test-push:
    runs-on: ubuntu-latest
    env:
      APP_PORT: ${{ vars.APP_PORT }}
      DATABASE_HOST: ${{ vars.DATABASE_HOST }}
      DATABASE_PORT: ${{ vars.DATABASE_PORT }}
      POSTGRES_DB: ${{ vars.POSTGRES_DB }}
      POSTGRES_USER: ${{ vars.POSTGRES_USER }}
      POSTGRES_PASSWORD: ${{ secrets.POSTGRES_PASSWORD }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run DVC pipeline
        run: dvc repro

      - name: Run tests with coverage
        run: pytest --cov=src/wine_quality_mlops --cov-report=xml --cov-report=term-missing

      - name: Resolve image tag
        id: image_meta
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            echo "tag=sha-${{ github.event.pull_request.head.sha }}" >> "$GITHUB_OUTPUT"
          else
            echo "tag=sha-${GITHUB_SHA}" >> "$GITHUB_OUTPUT"
          fi

      - name: Export image settings for compose
        shell: bash
        run: |
          if [ -n "${{ secrets.DOCKERHUB_USERNAME }}" ]; then
            echo "DOCKER_IMAGE_NAME=${{ secrets.DOCKERHUB_USERNAME }}/wine-quality-mlops" >> "$GITHUB_ENV"
          else
            echo "DOCKER_IMAGE_NAME=wine-quality-mlops" >> "$GITHUB_ENV"
          fi
          echo "DOCKER_IMAGE_TAG=${{ steps.image_meta.outputs.tag }}" >> "$GITHUB_ENV"

      - name: Build Docker image with compose
        run: docker compose build api

      - name: Login to DockerHub
        if: ${{ secrets.DOCKERHUB_USERNAME != '' && secrets.DOCKERHUB_TOKEN != '' }}
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Push Docker image
        if: ${{ secrets.DOCKERHUB_USERNAME != '' && secrets.DOCKERHUB_TOKEN != '' }}
        run: |
          docker tag "$DOCKER_IMAGE_NAME:$DOCKER_IMAGE_TAG" "$DOCKER_IMAGE_NAME:latest"
          docker push "$DOCKER_IMAGE_NAME:$DOCKER_IMAGE_TAG"
          docker push "$DOCKER_IMAGE_NAME:latest"

      - name: Generate dev_sec_ops metadata
        run: python scripts/generate_dev_sec_ops.py --image-ref $DOCKER_IMAGE_NAME:$DOCKER_IMAGE_TAG --coverage-xml coverage.xml --output dev_sec_ops.yml

      - name: Upload CI artifacts
        uses: actions/upload-artifact@v4
        with:
          name: lab1-ci-artifacts
          path: |
            coverage.xml
            dev_sec_ops.yml
            artifacts/metrics.json
